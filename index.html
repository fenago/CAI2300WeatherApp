<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#dbeafe" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <title>Weather</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply saved theme before first paint to avoid a flash
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main>
    <header class="toolbar">
      <form id="search" class="glass search" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="city" type="search" placeholder="Search for a city" autocomplete="off" aria-label="Search for a city">
      </form>

      <div class="glass segmented" id="theme" role="radiogroup" aria-label="Theme">
        <span class="seg-indicator" aria-hidden="true"></span>
        <button type="button" role="radio" data-value="system" aria-label="System theme" title="System">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          <span>System</span>
        </button>
        <button type="button" role="radio" data-value="light" aria-label="Light theme" title="Light">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Light</span>
        </button>
        <button type="button" role="radio" data-value="dark" aria-label="Dark theme" title="Dark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <span>Dark</span>
        </button>
      </div>
    </header>

    <section class="hero" aria-live="polite">
      <p class="eyebrow" id="updated">&nbsp;</p>
      <h1 id="place">Miami</h1>
      <div class="temp" id="temp">--°</div>
      <p class="condition" id="desc">Loading…</p>
      <p class="hilo" id="hilo">&nbsp;</p>
    </section>

    <section class="glass card">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Hourly Forecast
      </h2>
      <ol id="hourly" class="hourly"></ol>
    </section>

    <section class="glass card">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        10-Day Forecast
      </h2>
      <ol id="daily" class="daily"></ol>
    </section>

    <section class="tiles" id="tiles"></section>

    <p class="error" id="error" role="alert" hidden></p>

    <footer>
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
